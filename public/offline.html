<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión | Mi Colón</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .logo {
      height: 60px;
      width: auto;
      margin-bottom: 24px;
      object-fit: contain;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background-color: rgba(239, 68, 68, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon {
      width: 36px;
      height: 36px;
      fill: #ef4444;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .btn {
      background-color: #d97706;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover {
      background-color: #b45309;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo_colon.png" alt="Logo Mi Colón" class="logo">
    
    <div class="icon-wrapper">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 3c4.97 0 9.47 2.01 12.73 5.27l-2.12 2.12C19.98 7.76 16.22 6 12 6c-4.22 0-7.98 1.76-10.61 4.39L.66 8.27C3.93 5.01 8.43 3 12 3zm0 6c3.31 0 6.31 1.34 8.49 3.51l-2.12 2.12C16.8 13.06 14.52 12 12 12s-4.8 1.06-6.37 2.63l-2.12-2.12C5.69 10.34 8.69 9 12 9zm0 6c1.66 0 3.16.67 4.24 1.76l-4.24 4.24-4.24-4.24C8.84 15.67 10.34 15 12 15z" />
        <line x1="1" y1="1" x2="23" y2="23" stroke="#ef4444" stroke-width="2.5" />
      </svg>
    </div>

    <h1>Sin conexión a Internet</h1>
    <p>Parece que no tienes señal en este momento. Revisa tu conexión a Wi-Fi o datos móviles para continuar navegando en Mi Colón.</p>

    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Reintentar conexión
    </button>
  </div>

  <div class="footer">
    Mi Colón • Plataforma de Servicios
  </div>
</body>
</html>
